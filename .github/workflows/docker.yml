name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Позволяет запускать вручную

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Забрать код
      uses: actions/checkout@v4
    
    - name: 🔧 Собрать Docker-образ
      run: |
        docker build -t ваш_логин/joomla-project:latest .
    
    - name: 🔐 Войти в Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: 🚀 Загрузить образ на Docker Hub
      run: |
        docker push rahim004/joomla-project:latest
    
    - name: ✅ Проверить что загрузилось
      run: |
        echo "Образ успешно загружен на Docker Hub!"
        echo "Ссылка: https://hub.docker.com/r/ваш_логин/joomla-project"
